name: Build & Release

on:
  push:
    tags:
      - 'v*'
      - 'desktop-v*'
      - 'mobile-v*'
      - 'ios-v*'
      - 'android-v*'
      - 'extension-v*'
  workflow_dispatch:
    inputs:
      target:
        description: 'Build target'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - desktop
          - mobile
          - ios
          - android
          - extension

jobs:
  build-mac:
    runs-on: macos-latest
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/desktop-v') || inputs.target == 'all' || inputs.target == 'desktop'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Compute Tag
        id: tag
        run: |
          RAW_TAG="${GITHUB_REF_NAME}"
          CLEAN_TAG=$(echo "$RAW_TAG" | sed -E 's/^(desktop-|mobile-)//')
          echo "tag=$CLEAN_TAG" >> $GITHUB_OUTPUT
          echo "version=${CLEAN_TAG#v}" >> $GITHUB_OUTPUT

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build & package (macOS)
        run: pnpm --filter @yiqikan/desktop dist:mac
        env:
          GH_TOKEN: ""

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.blockmap
          generate_release_notes: false
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to Tencent Cloud COS
        continue-on-error: true
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
        run: |
          node scripts/upload-releases-cos.mjs apps/desktop/release/*.dmg

  build-win:
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/desktop-v') || inputs.target == 'all' || inputs.target == 'desktop'
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Compute Tag
        id: tag
        run: |
          RAW_TAG="${GITHUB_REF_NAME}"
          CLEAN_TAG=$(echo "$RAW_TAG" | sed -E 's/^(desktop-|mobile-)//')
          echo "tag=$CLEAN_TAG" >> $GITHUB_OUTPUT
          echo "version=${CLEAN_TAG#v}" >> $GITHUB_OUTPUT

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build & package (Windows)
        run: pnpm --filter @yiqikan/desktop dist:win
        env:
          GH_TOKEN: ""

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.blockmap
          generate_release_notes: false
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to Tencent Cloud COS
        continue-on-error: true
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
        run: |
          node scripts/upload-releases-cos.mjs apps/desktop/release/*.exe

  build-android:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/mobile-v') || startsWith(github.ref, 'refs/tags/android-v') || inputs.target == 'all' || inputs.target == 'mobile' || inputs.target == 'android'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Compute Tag
        id: tag
        run: |
          RAW_TAG="${GITHUB_REF_NAME}"
          CLEAN_TAG=$(echo "$RAW_TAG" | sed -E 's/^(desktop-|mobile-|ios-|android-|extension-)//')
          echo "tag=$CLEAN_TAG" >> $GITHUB_OUTPUT
          echo "version=${CLEAN_TAG#v}" >> $GITHUB_OUTPUT

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build & package (Android APK)
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          EXPO_PUBLIC_SERVER_URL: "https://yiqikan.club"
        run: |
          VERSION="${{ steps.tag.outputs.version }}"
          find node_modules -name "hermesc" -exec chmod +x {} + 2>/dev/null || true
          cd apps/mobile
          npx expo prebuild --platform android --clean
          mkdir -p android/app/src/main/assets
          npx expo export:embed --platform android --dev false --entry-file index.ts --bundle-output android/app/src/main/assets/index.android.bundle --assets-dest android/app/src/main/res/
          node -e "
            const { createManifestForBuildAsync } = require(require.resolve('expo-updates/utils/build/createManifestForBuildAsync'));
            createManifestForBuildAsync('android', process.cwd(), 'android/app/src/main/assets', 'index.ts')
              .then(() => console.log('✅ Generated app.manifest for expo-updates'))
              .catch(err => { console.error('Failed to generate app.manifest:', err); process.exit(1); });
          "
          cp credentials/yiqikan-release.keystore android/app/yiqikan-release.keystore
          node -e "
            const fs = require('fs');
            const file = 'android/app/build.gradle';
            let content = fs.readFileSync(file, 'utf-8');
            content = content.replace('react {', 'react {\n    debuggableVariants = [\"debug\", \"debugOptimized\", \"release\"]');
            const releaseSigning = \`        release {\\n            storeFile file('yiqikan-release.keystore')\\n            storePassword 'yiqikan2026'\\n            keyAlias 'yiqikan-key-alias'\\n            keyPassword 'yiqikan2026'\\n        }\\n\`;
            content = content.replace('signingConfigs {', 'signingConfigs {\\n' + releaseSigning);
            content = content.replace(/signingConfig signingConfigs\.debug/g, 'signingConfig signingConfigs.release');
            fs.writeFileSync(file, content);
          "
          cd android
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m" >> gradle.properties
          echo "org.gradle.parallel=true" >> gradle.properties
          echo "expo.inlineModules.watchedDirectories=[]" >> gradle.properties
          echo "YIQIKAN_RELEASE_STORE_FILE=yiqikan-release.keystore" >> gradle.properties
          echo "YIQIKAN_RELEASE_KEY_ALIAS=yiqikan-key-alias" >> gradle.properties
          echo "YIQIKAN_RELEASE_STORE_PASSWORD=yiqikan2026" >> gradle.properties
          echo "YIQIKAN_RELEASE_KEY_PASSWORD=yiqikan2026" >> gradle.properties
          ./gradlew assembleRelease --no-daemon --stacktrace -x lint -x lintVitalRelease -x lintVitalAnalyzeRelease
          mkdir -p ../release
          APK_FILE=$(find . -name "*.apk" | head -n 1)
          if [ -n "$APK_FILE" ]; then
            cp "$APK_FILE" "../release/Yiqikan.${VERSION}.apk"
            cp "$APK_FILE" "../release/Yiqikan.apk"
          else
            echo "Error: No APK file found!"
            exit 1
          fi

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: |
            apps/mobile/release/*.apk
          generate_release_notes: false
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to Tencent Cloud COS
        continue-on-error: true
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
        run: |
          node scripts/upload-releases-cos.mjs apps/mobile/release/*.apk

  build-ios:
    runs-on: macos-26
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/mobile-v') || startsWith(github.ref, 'refs/tags/ios-v') || inputs.target == 'all' || inputs.target == 'mobile' || inputs.target == 'ios'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Compute Tag
        id: tag
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            RAW_TAG="${GITHUB_REF_NAME}"
            CLEAN_TAG=$(echo "$RAW_TAG" | sed -E 's/^(desktop-|mobile-|ios-|android-|extension-)//')
          else
            VERSION=$(node -p "require('./apps/mobile/app.json').expo.version")
            CLEAN_TAG="v$VERSION"
          fi
          [[ "$CLEAN_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid iOS release tag: $CLEAN_TAG"; exit 1; }
          echo "tag=$CLEAN_TAG" >> $GITHUB_OUTPUT
          echo "version=${CLEAN_TAG#v}" >> $GITHUB_OUTPUT

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Select Xcode 26.4.1 (Expo SDK 57)
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.4.1.app/Contents/Developer
          xcodebuild -version

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: 24.8.0
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build iOS IPA (Local Build on GitHub macOS Runner)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          RELEASE_VERSION: ${{ steps.tag.outputs.version }}
          EXPO_PUBLIC_NATIVE_VOICE_ENABLED: "true"
          EXPO_USE_PRECOMPILED_MODULES: "0"
          LC_ALL: en_US.UTF-8
          LANG: en_US.UTF-8
        run: |
          set -euo pipefail
          VERSION="$RELEASE_VERSION"
          # 1. 规范化 TMPDIR 与 EAS 工作目录为真实物理路径（避免 macOS /var -> /private/var 软链导致 SPM 相对路径溢出）
          export TMPDIR="$(cd "${RUNNER_TEMP:-/tmp}" && pwd -P)"
          export EAS_LOCAL_BUILD_WORKINGDIR="${TMPDIR}/eas-work"
          mkdir -p "$EAS_LOCAL_BUILD_WORKINGDIR"

          # 2. 避免 Git SSH 鉴权失败与启用 Xcode 内置 SCM
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          defaults write com.apple.dt.Xcode IDEPackageSupportUseBuiltinSCM YES

          cd apps/mobile
          APP_VERSION=$(node -p "require('./app.json').expo.version")
          [[ "$VERSION" == "$APP_VERSION" ]] || { echo "iOS tag version must match app.json ($APP_VERSION)"; exit 1; }
          [[ ! -d ios ]] || { echo "Upload app config and plugins, not a generated ios directory"; exit 1; }
          mkdir -p release
          pnpm exec eas build --platform ios --profile production --local --non-interactive --freeze-credentials --verbose-logs --output "release/Yiqikan.${VERSION}.ipa"
          cp "release/Yiqikan.${VERSION}.ipa" "release/Yiqikan.ipa"

      - name: Upload iOS build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: apps/mobile/release/*.ipa
          if-no-files-found: error

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: |
            apps/mobile/release/*.ipa
          fail_on_unmatched_files: true
          generate_release_notes: false
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to Tencent Cloud COS
        continue-on-error: true
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
        run: |
          node scripts/upload-releases-cos.mjs apps/mobile/release/*.ipa

  build-extension:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/extension-v') || inputs.target == 'all' || inputs.target == 'extension'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Compute Tag
        id: tag
        run: |
          RAW_TAG="${GITHUB_REF_NAME}"
          CLEAN_TAG=$(echo "$RAW_TAG" | sed -E 's/^(desktop-|mobile-|extension-)//')
          echo "tag=$CLEAN_TAG" >> $GITHUB_OUTPUT
          echo "version=${CLEAN_TAG#v}" >> $GITHUB_OUTPUT

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: |
            apps/browser-extension/dist/*.zip
          generate_release_notes: false
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  cleanup:
    runs-on: ubuntu-latest
    needs: [build-mac, build-win, build-android, build-ios, build-extension]
    if: always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove source code, keep only README
        run: |
          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            ! -name 'README.md' \
            -exec rm -rf {} +

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "chore: cleanup source after release ${{ github.ref_name }}"
          git push origin main
