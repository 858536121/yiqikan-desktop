name: Build & Release

on:
  push:
    tags:
      - 'v*'
      - 'desktop-v*'
      - 'mobile-v*'
      - 'extension-v*'
  workflow_dispatch:
    inputs:
      target:
        description: 'Build target'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - desktop
          - mobile
          - extension

jobs:
  build-mac:
    runs-on: macos-latest
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/desktop-v') || inputs.target == 'all' || inputs.target == 'desktop'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Compute Tag
        id: tag
        run: |
          RAW_TAG="${GITHUB_REF_NAME}"
          CLEAN_TAG=$(echo "$RAW_TAG" | sed -E 's/^(desktop-|mobile-)//')
          echo "tag=$CLEAN_TAG" >> $GITHUB_OUTPUT
          echo "version=${CLEAN_TAG#v}" >> $GITHUB_OUTPUT

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build & package (macOS)
        run: pnpm --filter @yiqikan/desktop dist:mac
        env:
          GH_TOKEN: ""

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.blockmap
          generate_release_notes: false
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-win:
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/desktop-v') || inputs.target == 'all' || inputs.target == 'desktop'
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Compute Tag
        id: tag
        run: |
          RAW_TAG="${GITHUB_REF_NAME}"
          CLEAN_TAG=$(echo "$RAW_TAG" | sed -E 's/^(desktop-|mobile-)//')
          echo "tag=$CLEAN_TAG" >> $GITHUB_OUTPUT
          echo "version=${CLEAN_TAG#v}" >> $GITHUB_OUTPUT

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build & package (Windows)
        run: pnpm --filter @yiqikan/desktop dist:win
        env:
          GH_TOKEN: ""

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.blockmap
          generate_release_notes: false
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-android:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/mobile-v') || inputs.target == 'all' || inputs.target == 'mobile'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Compute Tag
        id: tag
        run: |
          RAW_TAG="${GITHUB_REF_NAME}"
          CLEAN_TAG=$(echo "$RAW_TAG" | sed -E 's/^(desktop-|mobile-)//')
          echo "tag=$CLEAN_TAG" >> $GITHUB_OUTPUT
          echo "version=${CLEAN_TAG#v}" >> $GITHUB_OUTPUT

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build & package (Android APK)
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          EXPO_PUBLIC_SERVER_URL: "https://together-ws.cpolar.cn"
        run: |
          VERSION="${{ steps.tag.outputs.version }}"
          find node_modules -name "hermesc" -exec chmod +x {} + 2>/dev/null || true
          cd apps/mobile
          npx expo prebuild --platform android --clean
          mkdir -p android/app/src/main/assets
          npx expo export:embed --platform android --dev false --entry-file index.ts --bundle-output android/app/src/main/assets/index.android.bundle --assets-dest android/app/src/main/res/
          node -e "
            const fs = require('fs');
            const file = 'android/app/build.gradle';
            let content = fs.readFileSync(file, 'utf-8');
            content = content.replace('react {', 'react {\n    debuggableVariants = [\"debug\", \"debugOptimized\", \"release\"]');
            fs.writeFileSync(file, content);
          "
          cd android
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m" >> gradle.properties
          echo "org.gradle.parallel=true" >> gradle.properties
          echo "expo.inlineModules.watchedDirectories=[]" >> gradle.properties
          ./gradlew assembleRelease --no-daemon --stacktrace -x lint -x lintVitalRelease -x lintVitalAnalyzeRelease
          mkdir -p ../release
          APK_FILE=$(find . -name "*.apk" | head -n 1)
          if [ -n "$APK_FILE" ]; then
            cp "$APK_FILE" "../release/Yiqikan.${VERSION}.apk"
            cp "$APK_FILE" "../release/Yiqikan.apk"
          else
            echo "Error: No APK file found!"
            exit 1
          fi

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: |
            apps/mobile/release/*.apk
          generate_release_notes: false
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-extension:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/extension-v') || inputs.target == 'all' || inputs.target == 'extension'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Compute Tag
        id: tag
        run: |
          RAW_TAG="${GITHUB_REF_NAME}"
          CLEAN_TAG=$(echo "$RAW_TAG" | sed -E 's/^(desktop-|mobile-|extension-)//')
          echo "tag=$CLEAN_TAG" >> $GITHUB_OUTPUT
          echo "version=${CLEAN_TAG#v}" >> $GITHUB_OUTPUT

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: |
            apps/browser-extension/dist/*.zip
          generate_release_notes: false
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  cleanup:
    runs-on: ubuntu-latest
    needs: [build-mac, build-win, build-android, build-extension]
    if: always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove source code, keep only README
        run: |
          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            ! -name 'README.md' \
            -exec rm -rf {} +

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "chore: cleanup source after release ${{ github.ref_name }}"
          git push origin main

