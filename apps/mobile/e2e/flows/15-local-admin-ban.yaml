appId: host.exp.Exponent
# Run after the browser confirms a ban. The remaining bot keeps the room open.
---
- tapOn:
    id: '确定'
    optional: true
- extendedWaitUntil:
    visible:
      id: 'home-create-room'
    timeout: 10000
- assertNotVisible: '正在重新连接房间'
- assertNotVisible:
    id: 'room-member-${TARGET_MEMBER_ID}'
- takeScreenshot: 'ios-banned-room-cleared'
