appId: host.exp.Exponent
---
# 点击顶部 header 唤醒 HUD
- tapOn:
    id: "fullscreen-header-controls-trigger"

# 点击右侧互动抽屉展开按钮
- tapOn:
    id: "横屏互动抽屉按钮"

- extendedWaitUntil:
    visible: "横屏弹幕输入框"
    timeout: 6000

# 截屏：验证右侧暗黑风格抽屉与输入栏（无系统白色框遮挡）
- takeScreenshot: verified_landscape_drawer_custom_input

# 点击快捷短语发送弹幕（例如 "666"）
- tapOn:
    text: "666"

# 截屏：验证弹幕破土而出、立即在视频区域匀速飞舞
- takeScreenshot: verified_danmaku_flying

# 唤醒 HUD 操作弹幕主开关
- tapOn:
    id: "fullscreen-header-controls-trigger"

# 点击弹幕开关关闭弹幕
- tapOn:
    id: "弹幕开关"

# 截屏：验证关闭后弹幕立即完全消失
- takeScreenshot: verified_danmaku_closed

# 再次唤醒 HUD
- tapOn:
    id: "fullscreen-header-controls-trigger"

# 再次点击弹幕开关重新开启
- tapOn:
    id: "弹幕开关"

# 截屏：验证重新开启后，屏幕无任何死锁停滞的静止弹幕残留
- takeScreenshot: verified_danmaku_reopened_clean
