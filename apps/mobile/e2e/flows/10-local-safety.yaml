appId: host.exp.Exponent
# 使用本地临时服务，先创建房间并添加测试伙伴；通过 -e TARGET_MEMBER_ID=... 指定伙伴。
---
- tapOn:
    id: 'room-member-${TARGET_MEMBER_ID}'
- tapOn:
    id: 'member-open-safety'
- tapOn:
    id: 'btn-submit-report'
- extendedWaitUntil:
    visible:
      id: 'report-receipt'
    timeout: 8000
- tapOn:
    id: 'btn-block-member'
- assertVisible:
    id: 'confirm-block-member'
- takeScreenshot: custom-block-confirm
- tapOn:
    id: '取消'
- assertVisible:
    id: 'report-receipt'
- assertNotVisible:
    id: 'confirm-block-member'
- tapOn:
    id: 'btn-block-member'
- tapOn:
    id: 'confirm-block-member'
- extendedWaitUntil:
    visible:
      id: 'home-create-room'
    timeout: 10000
- takeScreenshot: home-final-four-sites
- tapOn:
    id: '个人中心按钮'
- tapOn: '已屏蔽成员'
- tapOn: '解除屏蔽'
- assertVisible:
    id: 'confirm-unblock-member'
- takeScreenshot: custom-unblock-confirm
- tapOn:
    id: '取消'
- assertVisible: '本地测试伙伴'
- tapOn: '解除屏蔽'
- tapOn:
    id: 'confirm-unblock-member'
- extendedWaitUntil:
    visible: '暂无屏蔽记录'
    timeout: 5000
- tapOn:
    id: 'safety-close'
