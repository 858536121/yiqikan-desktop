appId: host.exp.Exponent
# 使用本地临时服务的四个推荐站点，在首页开始。
---
- tapOn:
    id: '忽略'
    optional: true
- extendedWaitUntil:
    visible:
      id: 'home-room-entry'
    timeout: 20000
- takeScreenshot: home-material-four-sites
- assertNotVisible:
    id: 'home-create-room'
- assertNotVisible:
    id: 'home-join-room'
- scrollUntilVisible:
    element:
      id: '推荐站点-测试站点四'
    direction: DOWN
    timeout: 10000
- assertVisible:
    id: '推荐站点-测试站点四'
- takeScreenshot: four-sites-bottom
- tapOn:
    id: 'home-room-entry'
- tapOn:
    id: 'home-join-room'
- extendedWaitUntil:
    visible:
      id: 'room-paste-invitation'
    timeout: 5000
- assertVisible:
    id: '加入已有房间'
- assertNotVisible:
    id: 'home-create-room'
- takeScreenshot: home-join-form
- tapOn:
    id: 'room-entry-close'
- tapOn:
    id: 'home-room-entry'
- tapOn:
    id: 'home-create-room'
- extendedWaitUntil:
    visible:
      id: '新建观影房间'
    timeout: 5000
- tapOn:
    id: '清空房间号'
    optional: true
- tapOn:
    id: '清空房间密码'
    optional: true
- tapOn:
    id: '新建观影房间'
- extendedWaitUntil:
    visible:
      id: 'home-manage-room'
    timeout: 10000
- takeScreenshot: room-created
