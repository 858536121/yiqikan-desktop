appId: host.exp.Exponent
---
# 若处于首页收起态，点击展开房间状态条管理房间
- tapOn:
    id: "首页房间状态条"
    optional: true

- tapOn:
    text: ".*管理房间.*"
    optional: true

- tapOn:
    id: "房间成员标签页"
    optional: true

- extendedWaitUntil:
    visible: "房间成员 (1人)"
    timeout: 8000

- tapOn:
    id: "退出房间"

- tapOn:
    id: "确定"
    optional: true

- tapOn:
    text: "确定.*"
    optional: true

# 退出房间后恢复首页入口，点击直接打开创建表单
- extendedWaitUntil:
    visible:
      id: "home-create-room"
    timeout: 8000
- tapOn:
    id: "home-create-room"
- extendedWaitUntil:
    visible: "新建观影房间"
    timeout: 6000
