appId: host.exp.Exponent
---
- tapOn:
    id: '个人中心按钮'
- tapOn: '我的举报'
- extendedWaitUntil:
    visible: '本地验收：举报已核查，未新增限制'
    timeout: 10000
- takeScreenshot: 'ios-reporter-feedback'
- tapOn:
    id: 'safety-close'
- tapOn:
    id: '弹幕互动标签页'
- tapOn: '发条弹幕聊天互动吧...'
- inputText: 'E2E-before-mute'
- pressKey: Enter
- extendedWaitUntil:
    visible: '我：E2E-before-mute'
    timeout: 8000
- takeScreenshot: 'ios-chat-accepted'
