# 从未加入房间的视频页面开始；iOS 模拟器需启用屏幕键盘。
appId: host.exp.Exponent
---
- tapOn:
    text: 不允许粘贴
    optional: true
- tapOn:
    id: 房间成员标签页
- assertVisible:
    id: room-panel-create
- assertVisible:
    id: room-panel-join
- assertVisible:
    id: room-panel-paste
- assertNotVisible:
    id: 房间昵称输入框
- takeScreenshot: room-actions-panel
- tapOn:
    id: room-panel-create
- assertVisible:
    id: room-entry-close
- assertVisible:
    id: 房间昵称输入框
- takeScreenshot: room-form-normal
- tapOn:
    id: 房间昵称输入框
- inputText: a
- takeScreenshot: room-form-nickname-keyboard
- pressKey: Enter
- inputText: kbtest
- takeScreenshot: room-form-room-id-keyboard
- pressKey: Enter
- inputText: '2468'
- takeScreenshot: room-form-password-keyboard
- tapOn:
    id: 密码显隐切换
- takeScreenshot: room-form-password-visible
- tapOn:
    id: 密码显隐切换
- tapOn:
    id: 清空房间密码
- tapOn:
    id: 清空房间号
- tapOn:
    id: 房间昵称输入框
- eraseText: 1
- swipe:
    start: '50%,45%'
    end: '50%,30%'
    duration: 500
- takeScreenshot: room-form-keyboard-dismissed
- tapOn:
    id: room-entry-close
- assertVisible:
    id: room-panel-create
- assertNotVisible:
    id: 房间昵称输入框
- tapOn:
    id: 视频标签页
- assertVisible:
    id: 房间成员标签页
- takeScreenshot: back-to-video-panel
