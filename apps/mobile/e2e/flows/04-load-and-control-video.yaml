appId: host.exp.Exponent
---
# 点击推荐站点加载视频
- tapOn:
    text: ".*哔哩哔哩.*"

# 等待顶部浏览器工具栏加载完成（证明已成功切入视频WebView模式）
- extendedWaitUntil:
    visible: "返回主页"
    timeout: 12000

# 切换到底部【遥控】标签页
- tapOn:
    text: "遥控.*"
    optional: true

# 验证底部房主播控状态
- extendedWaitUntil:
    visible: ".*你是房主.*"
    timeout: 8000

- assertVisible: "快退10秒"
- assertVisible: "快进10秒"
- assertVisible: "播放暂停按钮"

# 触发快进10秒
- tapOn: "快进10秒"

# 触发播放/暂停切换
- tapOn: "播放暂停按钮"

# 切换倍速至 1.5x
- tapOn:
    text: ".*1.5x.*"
    optional: true
