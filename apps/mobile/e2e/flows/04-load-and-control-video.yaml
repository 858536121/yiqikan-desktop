appId: host.exp.Exponent
---
# 点击推荐站点加载视频
- tapOn:
    id: "推荐站点-哔哩哔哩"

- tapOn:
    text: ".*哔哩哔哩.*"
    optional: true

# 等待顶部浏览器工具栏加载完成（证明已成功切入视频WebView模式）
- extendedWaitUntil:
    visible: "返回首页"
    timeout: 12000

# 切换到底部【视频】标签页
- tapOn:
    id: "视频标签页"
    optional: true

- tapOn:
    text: "视频.*"
    optional: true

# 验证底部房主播控状态
- extendedWaitUntil:
    visible: ".*你是房主.*"
    timeout: 8000

- assertVisible: "快退10秒"
- assertVisible: "快进10秒"
- assertVisible: "播放暂停按钮"

# 触发快进10秒
- tapOn: "快进10秒"

# 触发播放/暂停切换
- tapOn: "播放暂停按钮"
