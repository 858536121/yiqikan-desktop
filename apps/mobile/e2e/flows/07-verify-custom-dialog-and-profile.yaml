appId: host.exp.Exponent
---
# 如果在主页未打开个人中心，点击进入
- tapOn:
    id: "个人中心按钮"
    optional: true

# 1. 点击「清理本地播放缓存」位置 (50%, 88%)
- tapOn:
    point: "50%,88%"

# 等待弹窗渲染并截图验证
- takeScreenshot: "verified_custom_confirm_dialog"

# 2. 点击「取消」按钮 (左边按钮，大约 30%, 58%)
- tapOn:
    point: "30%,58%"

# 3. 点击「检查更新」位置 (50%, 80%)
- tapOn:
    point: "50%,80%"

# 等待弹窗渲染并截图验证
- takeScreenshot: "verified_update_custom_dialog"

# 4. 点击「我知道了」按钮 (中间按钮，大约 50%, 58%)
- tapOn:
    point: "50%,58%"

- takeScreenshot: "verified_profile_done"
