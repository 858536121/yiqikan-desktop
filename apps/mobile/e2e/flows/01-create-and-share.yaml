appId: host.exp.Exponent
---
- tapOn:
    text: "允许粘贴"
    optional: true

# 如果处于房间内，点击退出房间返回大厅
- tapOn:
    id: "退出房间"
    optional: true

- extendedWaitUntil:
    visible: "新建观影房间"
    timeout: 6000

# 点击新建观影房间
- tapOn: "新建观影房间"

# 验证就绪
- extendedWaitUntil:
    visible: "进入语音"
    timeout: 6000
- assertVisible: "在线成员 (1人)"
- assertVisible:
    text: ".*房主.*"

# 点击分享邀请口令并确定
- tapOn:
    id: "分享邀请口令"
    optional: true

- tapOn:
    point: "85%,64%"
    optional: true

- extendedWaitUntil:
    visible: "邀请口令已复制"
    timeout: 3000
- tapOn:
    text: "好的"
    optional: true
