appId: host.exp.Exponent
---
# 0. 若处于 Expo Go 项目列表页，自动点击进入应用
- tapOn:
    text: "异起看"
    optional: true

# 1. 验证首页大厅就绪并点击建房
- extendedWaitUntil:
    visible: "新建观影房间"
    timeout: 10000
- tapOn: "新建观影房间"

# 2. 验证房间状态快照与房主身份
- extendedWaitUntil:
    visible: "进入语音"
    timeout: 10000
- assertVisible: "设置密码"
- assertVisible: "在线成员 (1人)"
- assertVisible:
    text: ".*房主.*"

# 3. 切换弹幕互动 Tab 并发送实时消息
- tapOn: "弹幕互动"
- tapOn: "发条弹幕聊天互动吧..."
- inputText: "Hello YIQIKAN AI Test"
- pressKey: Enter
- extendedWaitUntil:
    visible: "Hello YIQIKAN AI Test"
    timeout: 5000

# 4. 切换回房间 Tab 并测试邀请口令分享
- tapOn: "房间 (1)"
- tapOn:
    point: "85%,64%"
- extendedWaitUntil:
    visible: "邀请口令已复制"
    timeout: 5000
- tapOn: "OK"

# 5. 点击退出房间，验证平滑返回首页大厅
- tapOn:
    point: "93%,64%"
- extendedWaitUntil:
    visible: "新建观影房间"
    timeout: 5000
