appId: host.exp.Exponent
---
# 1. 点击首页胶囊进入视频
- tapOn:
    id: "首页继续观看胶囊"

- extendedWaitUntil:
    visible: "返回主页"
    timeout: 12000

# 2. 验证出现关闭按钮并点击
- extendedWaitUntil:
    visible: "关闭续播提示"
    timeout: 8000

- tapOn:
    id: "关闭面板续播卡片按钮"

# 3. 验证卡片立即收起消失
- assertNotVisible:
    id: "关闭面板续播卡片按钮"

- assertNotVisible:
    text: ".*点击一键同步全房间跳转.*"
