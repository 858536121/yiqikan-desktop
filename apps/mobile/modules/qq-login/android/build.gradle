plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.yiqikanqq'
version = '1.0.0'

def sdkJar = file('../sdk/tencent-login.jar')
def fragmentJar = file('../sdk/support-fragment.jar')
def withQq = providers.environmentVariable('YIQIKAN_QQ_LOGIN_NATIVE').orNull == '1' ||
    providers.environmentVariable('YIQIKAN_QQ_PROBE_NATIVE').orNull == '1'
if (withQq && (!sdkJar.exists() || !fragmentJar.exists())) {
  throw new GradleException('QQ login needs sdk/tencent-login.jar and sdk/support-fragment.jar')
}

android {
  namespace 'expo.modules.yiqikanqq'
  defaultConfig {
    versionCode 1
    versionName project.version.toString()
  }
  sourceSets.main.java.srcDir(withQq ? 'src/qq/java' : 'src/stub/java')
  if (withQq) sourceSets.main.manifest.srcFile('src/qq/AndroidManifest.xml')
}

dependencies {
  if (withQq) {
    implementation files(sdkJar)
    compileOnly files(fragmentJar)
  }
}
