<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>异起看 · 网络连接受阻</title>
  <style>
    :root {
      --bg: #0e0e11;
      --card-bg: rgba(22, 22, 27, 0.85);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-main: #f4f4f6;
      --text-muted: #8e8e99;
      --primary: #f97316;
      --primary-hover: #ea580c;
      --accent: #06b6d4;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-user-select: none;
      user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow: hidden;
      background-image: 
        radial-gradient(circle at 50% 20%, rgba(249, 115, 22, 0.08) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(6, 182, 212, 0.05) 0%, transparent 50%);
    }

    .top-drag-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 36px;
      -webkit-app-region: drag;
      z-index: 100;
    }

    .container {
      width: 100%;
      max-width: 460px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 36px 32px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 1px rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(20px);
      position: relative;
      animation: fadeIn 0.3s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .icon-wrapper {
      position: relative;
      width: 76px;
      height: 76px;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, rgba(249, 115, 22, 0.15), rgba(225, 29, 72, 0.12));
      border: 1px solid rgba(249, 115, 22, 0.3);
      border-radius: 22px;
      box-shadow: 0 12px 30px rgba(249, 115, 22, 0.15);
    }

    .icon-wrapper svg {
      width: 38px;
      height: 38px;
      color: #fb923c;
    }

    .pulse-dot {
      position: absolute;
      bottom: -2px;
      right: -2px;
      width: 14px;
      height: 14px;
      background-color: #ef4444;
      border: 2.5px solid var(--bg);
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
      70% { box-shadow: 0 0 0 8px rgba(239, 68, 68, 0); }
      100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }

    h1 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.01em;
      margin-bottom: 8px;
      color: #fff;
    }

    p.subtitle {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 20px;
    }

    .error-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11px;
      padding: 4px 10px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      color: #d4d4d8;
      margin-bottom: 24px;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
      -webkit-app-region: no-drag;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 12px 18px;
      border-radius: 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      border: none;
      outline: none;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary), #ea580c);
      color: #fff;
      box-shadow: 0 6px 18px rgba(249, 115, 22, 0.25);
    }

    .btn-primary:hover {
      opacity: 0.95;
      transform: translateY(-1px);
      box-shadow: 0 8px 24px rgba(249, 115, 22, 0.35);
    }

    .btn-primary:active {
      transform: translateY(0) scale(0.99);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.06);
      color: #e4e4e7;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
    }

    .btn svg {
      width: 16px;
      height: 16px;
      stroke-width: 2.2;
    }

    .countdown-bar {
      font-size: 11px;
      color: #a1a1aa;
      margin-top: 14px;
      cursor: pointer;
      display: inline-block;
      transition: color 0.15s;
    }

    .countdown-bar:hover {
      color: #fb923c;
    }

    .badge-tip {
      font-size: 11px;
      color: #71717a;
      margin-top: 18px;
    }

    .spinning {
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="top-drag-bar"></div>

  <div class="container">
    <div class="icon-wrapper">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
      <div class="pulse-dot"></div>
    </div>

    <h1>放映服务器连接受阻</h1>
    <p class="subtitle" id="subtitle-text">无法连通异起看在线放映服务。请检查您的 Wi-Fi 或网络设置。</p>

    <div class="error-tag" id="error-badge">网络状态: 离线或服务超时</div>

    <div class="actions">
      <button class="btn btn-primary" id="retry-btn">
        <svg id="retry-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"></path>
        </svg>
        <span id="retry-btn-text">立即重试连接</span>
      </button>
    </div>

    <div class="countdown-bar" id="countdown-btn">将在 <strong id="countdown-num">5</strong> 秒后自动尝试重连 (点击暂停)</div>

    <div class="badge-tip">
      快捷键提示：按 <strong>F5</strong> 重新加载，按 <strong>Ctrl+Shift+R</strong> (Mac: <strong>Cmd+Shift+R</strong>) 强刷
    </div>
  </div>

  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const errorCode = params.get("errorCode");
      const errorDesc = params.get("errorDescription");
      const httpCode = params.get("httpCode");
      const crashed = params.get("crashed");
      const targetUrl = params.get("targetUrl") || "https://yiqikan.club/room";

      const subtitle = document.getElementById("subtitle-text");
      const badge = document.getElementById("error-badge");
      const retryBtn = document.getElementById("retry-btn");
      const retryIcon = document.getElementById("retry-icon");
      const retryText = document.getElementById("retry-btn-text");
      const countdownBtn = document.getElementById("countdown-btn");
      const countdownNum = document.getElementById("countdown-num");

      if (crashed === "true") {
        document.querySelector("h1").innerText = "放映页面异常崩溃";
        subtitle.innerText = "页面渲染进程遇到了意料之外的错误已退出，点击下方按钮可立即重启。";
        badge.innerText = "原因: " + (params.get("reason") || "RenderProcessGone");
      } else if (httpCode) {
        subtitle.innerText = "放映服务器响应异常 (HTTP " + httpCode + ")，可能正在升级维护或重启，请稍候。";
        badge.innerText = "HTTP 状态码: " + httpCode;
      } else if (errorCode) {
        badge.innerText = "错误代码: " + errorCode + (errorDesc ? " (" + errorDesc + ")" : "");
      }

      let secondsLeft = 5;
      let isPaused = false;
      let timer = null;

      function doRetry() {
        if (timer) clearInterval(timer);
        retryIcon.classList.add("spinning");
        retryText.innerText = "正在重新连接…";
        retryBtn.disabled = true;

        if (window.yiqikan && typeof window.yiqikan.retryOnline === "function") {
          window.yiqikan.retryOnline(targetUrl);
        } else {
          setTimeout(() => {
            window.location.href = targetUrl;
          }, 400);
        }
      }

      retryBtn.addEventListener("click", doRetry);

      countdownBtn.addEventListener("click", function () {
        isPaused = !isPaused;
        if (isPaused) {
          countdownBtn.innerText = "自动重连已暂停 (点击恢复)";
          countdownBtn.style.color = "#f97316";
        } else {
          countdownBtn.innerHTML = '将在 <strong id="countdown-num">' + secondsLeft + '</strong> 秒后自动尝试重连 (点击暂停)';
          countdownBtn.style.color = "";
        }
      });

      timer = setInterval(function () {
        if (isPaused) return;
        secondsLeft--;
        const numElem = document.getElementById("countdown-num");
        if (numElem) numElem.innerText = String(secondsLeft);
        if (secondsLeft <= 0) {
          clearInterval(timer);
          doRetry();
        }
      }, 1000);

      window.addEventListener("online", function () {
        console.info("[Desktop Error Page] 检测到系统网络已恢复，立即尝试重新连接！");
        doRetry();
      });
    })();
  </script>
</body>
</html>
