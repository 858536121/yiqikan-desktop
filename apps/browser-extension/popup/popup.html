<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>异起看 · 观影助手</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <div class="logo">
      <img src="../icons/icon-32.png" alt="Logo" class="app-icon" width="20" height="20">
      <span class="title">异起看 · 观影助手</span>
    </div>
    <span id="statusBadge" class="badge inactive">已自动休眠</span>
  </div>

  <div class="content">
    <p id="statusDesc" class="desc">当前网页非异起看放映室，插件已自动休眠，0 性能开销。</p>
    
    <div class="features">
      <div class="feature-item">
        <span id="featIcon1" class="check">•</span>
        <span id="featText1">仅在异起看放映室内自动运行</span>
      </div>
      <div class="feature-item">
        <span id="featIcon2" class="check">•</span>
        <span id="featText2">其它网页完全静默、0 资源占用</span>
      </div>
      <div class="feature-item">
        <span id="featIcon3" class="check">•</span>
        <span id="featText3">全网视频解嵌与毫秒级跨屏同步</span>
      </div>
    </div>

    <button id="openWebRoomBtn" class="btn">进入异起看 Web 房间</button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
